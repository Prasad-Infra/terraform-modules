name: Terraform Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --format compact